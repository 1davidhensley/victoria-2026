<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Victoria 26">
  <meta name="description" content="David & Paula's Victoria, BC trip guide — October 9–12, 2026">
  <title>Victoria 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231f5f8b'/><text y='.9em' x='50' text-anchor='middle' font-size='65'>🇨🇦</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231f5f8b'/><text y='.9em' x='50' text-anchor='middle' font-size='65'>🇨🇦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Design tokens — "Inner Harbour" palette
       Pacific blue (harbour) · Douglas fir green (fir) ·
       Butchart florals (bloom) · Race Day accent (race)
       RULE: every color here needs a dark-mode counterpart below.
       ============================================================ */
    :root {
      --paper: #f5f3ee;
      --paper-2: #ebe7de;
      --card: #ffffff;
      --ink: #14212b;
      --ink-2: #34434f;
      --ink-dim: #6b7780;
      --hairline: #d9d4c8;

      --harbour: #1f5f8b;
      --harbour-soft: rgba(31, 95, 139, 0.10);
      --fir: #2e5e45;
      --fir-soft: rgba(46, 94, 69, 0.12);
      --bloom: #b83b6e;
      --bloom-soft: rgba(184, 59, 110, 0.10);

      /* Race Day accent — Sunday's card, race banner, start-line highlight.
         Never hardcode this hex elsewhere; use var(--race). */
      --race: #d4531c;
      --race-soft: rgba(212, 83, 28, 0.12);
      /* Birthday accent — Paula's birthday (also Sunday) */
      --bday: var(--bloom);
      --bday-soft: var(--bloom-soft);

      --warn: #9a6200;
      --warn-soft: rgba(168, 106, 0, 0.12);

      /* Boarding-pass QR backdrop: scanners need dark-on-white, so it stays white in dark mode too */
      --qr-bg: #ffffff;

      --shadow: 0 1px 2px rgba(20, 33, 43, 0.06), 0 4px 14px rgba(20, 33, 43, 0.06);
      --radius: 14px;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Work Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0e1418;
        --paper-2: #172028;
        --card: #141c22;
        --ink: #eef1f2;
        --ink-2: #c3ccd2;
        --ink-dim: #8a969e;
        --hairline: #26323b;

        --harbour: #6fb0de;
        --harbour-soft: rgba(111, 176, 222, 0.16);
        --fir: #8cc7a2;
        --fir-soft: rgba(140, 199, 162, 0.14);
        --bloom: #f08cb6;
        --bloom-soft: rgba(240, 140, 182, 0.14);

        --race: #ff8d5a;
        --race-soft: rgba(255, 141, 90, 0.16);

        --warn: #f0b64a;
        --warn-soft: rgba(240, 182, 74, 0.14);

        --qr-bg: #ffffff; /* deliberately unchanged — see :root */

        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 64px; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: var(--harbour); }
    strong { font-weight: 600; }

    /* ---------- Hero ---------- */
    .hero {
      background: linear-gradient(135deg, var(--harbour), var(--fir));
      color: #fff;
      padding: calc(28px + env(safe-area-inset-top)) 20px 26px;
    }
    .hero-inner { max-width: 720px; margin: 0 auto; }
    .hero-kicker { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
    .hero h1 { font-family: var(--font-display); font-size: 2.2rem; line-height: 1.1; margin: 6px 0 8px; }
    .hero-meta { font-size: 0.92rem; opacity: 0.92; }
    .hero-meta span { white-space: nowrap; }
    .countdown { margin-top: 12px; display: inline-block; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; font-weight: 600; }

    /* ---------- Sticky pill nav ---------- */
    .nav {
      position: sticky; top: 0; z-index: 20;
      background: var(--paper);
      border-bottom: 1px solid var(--hairline);
    }
    .nav-inner {
      max-width: 720px; margin: 0 auto;
      display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px;
      scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }
    .pill {
      flex: 0 0 auto;
      border: 1.5px solid var(--hairline);
      background: var(--card);
      color: var(--ink-2);
      border-radius: 999px;
      padding: 6px 13px;
      font: 600 0.82rem var(--font-body);
      text-decoration: none;
      white-space: nowrap;
    }
    .pill.today { border-color: var(--harbour); color: var(--harbour); }
    .pill.race { border-color: var(--race); color: var(--race); }
    .pill.aux { border-style: dashed; }

    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
    .section-title { font-family: var(--font-display); font-size: 1.4rem; margin: 28px 0 12px; }

    /* ---------- Day cards ---------- */
    .day-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      border-left: 5px solid var(--harbour);
      overflow: hidden;
    }
    .day-card.race-day { border-left-color: var(--race); }
    .day-card.race-day.bday-day {
      border-left: 5px solid transparent;
      border-image: linear-gradient(to bottom, var(--race), var(--bday)) 1;
    }
    .day-card.today-card { outline: 2px solid var(--harbour); outline-offset: 2px; }
    .day-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 14px; cursor: pointer; user-select: none;
    }
    .day-num-row { display: flex; align-items: baseline; gap: 8px; }
    .day-number { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; color: var(--harbour); }
    .race-day .day-number { color: var(--race); }
    .day-weekday { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
    .day-theme { font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
    .day-date { font-size: 0.82rem; color: var(--ink-dim); }
    .day-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .badge { font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
    .badge.race { background: var(--race-soft); color: var(--race); }
    .badge.bday { background: var(--bday-soft); color: var(--bday); }
    .badge.holiday { background: var(--warn-soft); color: var(--warn); }
    .day-toggle { font-size: 1.2rem; color: var(--ink-dim); transition: transform 0.3s; }
    .day-card.expanded .day-toggle { transform: rotate(180deg); }

    /* Expand animation — KEEP max-height as a large number (not `none`, not small).
       `none` kills the transition; a small value (London's old 3000px) silently
       truncates long days under overflow:hidden. See KNOWN-ISSUES.md. */
    .day-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s ease;
      padding: 0 16px;
    }
    .day-card.expanded .day-content {
      max-height: 50000px;
      padding-bottom: 16px;
    }

    /* ---------- Weather bar (metric first, imperial pill) ---------- */
    .weather-bar {
      display: flex; align-items: center; gap: 12px;
      background: var(--harbour-soft);
      border-radius: 10px; padding: 8px 12px; margin-bottom: 14px;
      font-size: 0.88rem;
    }
    .weather-icon { font-size: 1.5rem; }
    .weather-temp { font-weight: 700; }
    .imperial-pill {
      font-size: 0.72rem; font-weight: 600; color: var(--ink-dim);
      border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 7px; margin-left: 4px;
      white-space: nowrap;
    }
    .weather-rain { color: var(--ink-2); }
    .weather-src { margin-left: auto; font-size: 0.7rem; color: var(--ink-dim); }

    /* ---------- Race / birthday banners ---------- */
    .racemode {
      position: relative;
      background: var(--race-soft);
      border: 1.5px solid var(--race);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    }
    .racemode[hidden] { display: none; }
    .race-k { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--race); }
    .race-count { font-family: var(--font-display); font-size: 1.5rem; color: var(--race); }
    .race-sub { font-size: 0.85rem; color: var(--ink-2); }
    .race-close { position: absolute; top: 6px; right: 10px; border: 0; background: none; font-size: 1.3rem; color: var(--ink-dim); cursor: pointer; }
    .race-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
    .race-chip { background: var(--card); border-radius: 8px; padding: 6px 9px; font-size: 0.78rem; color: var(--ink-2); }
    .race-chip b { display: block; color: var(--ink); font-size: 0.82rem; }
    .bday-note {
      background: var(--bday-soft); border: 1.5px dashed var(--bday);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
      font-size: 0.9rem; color: var(--ink);
    }
    .bday-note b { color: var(--bday); }

    /* ---------- Stops ---------- */
    .stop-list { position: relative; }
    .stop {
      position: relative;
      padding: 10px 0 12px 22px;
      border-bottom: 1px solid var(--hairline);
    }
    .stop:last-child { border-bottom: 0; }
    .stop::before {
      content: ''; position: absolute; left: 4px; top: 16px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--harbour);
    }
    .race-day .stop::before { background: var(--race); }
    .stop.start-line { background: var(--race-soft); margin: 0 -16px; padding-left: 38px; padding-right: 16px; }
    .stop.start-line::before { left: 20px; }
    .stop.bday-stop { background: var(--bday-soft); margin: 0 -16px; padding-left: 38px; padding-right: 16px; }
    .stop.bday-stop::before { left: 20px; background: var(--bday); }
    .stop.now { box-shadow: inset 3px 0 0 var(--harbour); }
    .stop.now .stop-time::after { content: ' · 📍 Now'; color: var(--harbour); }
    .stop-time {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      color: var(--harbour); background: var(--harbour-soft);
      border-radius: 6px; padding: 1px 7px; margin-bottom: 3px;
    }
    .race-day .stop-time { color: var(--race); background: var(--race-soft); }
    .stop-header { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
    .stop-emoji { flex: 0 0 auto; }
    .stop-name a { color: inherit; text-decoration-color: var(--hairline); text-underline-offset: 3px; }
    .stop-details { font-size: 0.9rem; color: var(--ink-2); margin-top: 4px; }
    .stop-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .maps-btn {
      font-size: 0.78rem; font-weight: 600; text-decoration: none;
      color: var(--harbour); border: 1.5px solid var(--harbour);
      border-radius: 999px; padding: 3px 10px;
    }
    .tag { font-size: 0.74rem; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
    .tag.res { background: var(--fir-soft); color: var(--fir); border: 1.5px solid var(--fir); }
    .tag.sugg { background: var(--paper-2); color: var(--ink-dim); border: 1.5px dashed var(--hairline); }
    .tag.tbd { background: var(--warn-soft); color: var(--warn); }
    .tag.hl { background: var(--race); color: #fff; }
    .tbd-note { font-size: 0.8rem; color: var(--warn); margin-top: 6px; }
    .ticket-btn {
      display: block; width: 100%; margin-top: 8px;
      font: 600 0.88rem var(--font-body);
      background: var(--harbour); color: #fff; border: 0; border-radius: 10px; padding: 9px;
      cursor: pointer;
    }
    .stop-checklist { margin-top: 8px; }
    .stop-checklist-item { display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; padding: 3px 0; }
    .stop-checklist-item input { margin-top: 3px; accent-color: var(--harbour); width: 16px; height: 16px; flex: 0 0 auto; }
    .stop-checklist-item input:checked + label { color: var(--ink-dim); text-decoration: line-through; }

    .walk-transition {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 0 6px; padding: 8px 0 8px 14px;
      border-left: 2px dashed var(--fir);
      font-size: 0.82rem; color: var(--fir);
    }
    .walk-maps { font-weight: 600; color: var(--fir); }

    .inline-transport {
      background: var(--paper-2); border-radius: 10px;
      padding: 10px 12px; margin: 8px 0 4px;
      font-size: 0.86rem;
    }
    .inline-transport-title { font-weight: 700; margin-bottom: 6px; }
    .transport-step { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
    .transport-step-icon {
      flex: 0 0 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center; font-size: 0.7rem; color: #fff; background: var(--harbour);
    }
    .step-ride { background: var(--ink-dim); }
    .step-exit { background: var(--fir); }
    .transport-time { font-size: 0.78rem; color: var(--ink-dim); margin-top: 6px; }

    /* ---------- Resources / Travel / Packing ---------- */
    .panel {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 12px; overflow: hidden;
    }
    .panel > summary {
      list-style: none; cursor: pointer; padding: 14px 16px;
      font-weight: 700; display: flex; justify-content: space-between; align-items: center;
    }
    .panel > summary::-webkit-details-marker { display: none; }
    .panel > summary::after { content: '▾'; color: var(--ink-dim); transition: transform 0.2s; }
    .panel[open] > summary::after { transform: rotate(180deg); }
    .panel-body { padding: 0 16px 14px; font-size: 0.9rem; color: var(--ink-2); }
    .row { padding: 8px 0; border-top: 1px solid var(--hairline); }
    .row:first-child { border-top: 0; }
    .row-title { font-weight: 700; color: var(--ink); }
    .muted { color: var(--ink-dim); font-size: 0.82rem; }
    .conf { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.85rem; background: var(--paper-2); padding: 0 5px; border-radius: 4px; }

    .pack-progress { font-size: 0.82rem; color: var(--ink-dim); margin: -4px 0 10px; }
    .pack-cat { font-weight: 700; color: var(--ink); margin: 10px 0 4px; }
    .pack-item { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
    .pack-item input { accent-color: var(--fir); width: 16px; height: 16px; }
    .pack-item input:checked + label { color: var(--ink-dim); text-decoration: line-through; }
    .pack-reset { margin-top: 10px; font: 600 0.8rem var(--font-body); background: none; border: 1px solid var(--hairline); color: var(--ink-dim); border-radius: 999px; padding: 4px 12px; cursor: pointer; }

    footer { text-align: center; font-size: 0.78rem; color: var(--ink-dim); padding: 10px 16px 40px; }
    #versionTag.stale { color: var(--race); font-weight: 600; }

    /* ---------- Ticket modal ---------- */
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 12px; }
    .modal.open { display: flex; }
    .modal-content { background: var(--card); border-radius: var(--radius); width: 100%; max-width: 720px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--hairline); }
    .modal-header h2 { font-size: 1rem; }
    .modal-close { border: 0; background: none; font-size: 1.6rem; color: var(--ink-dim); cursor: pointer; }
    .modal-body { flex: 1; overflow-y: auto; }
    .modal-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }

    /* Boarding passes: the QR sits on --qr-bg (white in BOTH themes) so the terminal scanner
       gets full contrast in dark mode; pixelated keeps the 90px source crisp when scaled up. */
    .pass-tip { font-size: 0.82rem; color: var(--ink-dim); text-align: center; padding: 10px 14px 0; }
    .pass { padding: 14px; border-bottom: 1px solid var(--hairline); text-align: center; }
    .pass:last-child { border-bottom: 0; }
    .pass-who { font: 700 1.15rem var(--font-display); }
    .pass-seat { font-weight: 700; color: var(--harbour); }
    .pass-qr { display: inline-block; background: var(--qr-bg); border-radius: 10px; padding: 8px; margin: 8px 0 6px; }
    /* 270px = exactly 3× the 90px source, so 2×/3× screens get whole-pixel modules (crisp edges for scanners) */
    .pass-qr img { display: block; width: 270px; max-width: 100%; height: auto; image-rendering: pixelated; }
    .pass-meta { font-size: 0.84rem; color: var(--ink-2); }

    .back-to-top {
      position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
      width: 44px; height: 44px; border-radius: 50%; border: 0;
      background: var(--harbour); color: #fff; font-size: 1.2rem; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: opacity 0.2s; cursor: pointer;
    }
    .back-to-top.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-kicker">David &amp; Paula · Victoria, BC 🇨🇦</div>
      <h1>Victoria 2026</h1>
      <div class="hero-meta">
        <span>Fri Oct 9 – Mon Oct 12</span> ·
        <span>🏅 Royal Victoria Half</span> ·
        <span>🎂 Paula's birthday</span>
      </div>
      <div class="countdown" id="tripCountdown"></div>
    </div>
  </header>

  <nav class="nav" aria-label="Days">
    <div class="nav-inner" id="dayPills"></div>
  </nav>

  <main>
    <div id="dayCards"></div>

    <h2 class="section-title" id="travel">Travel &amp; Stays</h2>
    <details class="panel" open>
      <summary>⛴️ Clipper · 🏨 Empress · 🎽 Race entry</summary>
      <div class="panel-body" id="travelGrid"></div>
    </details>

    <h2 class="section-title" id="resources">Resources</h2>
    <div id="resourcesList"></div>

    <h2 class="section-title" id="packing">Packing</h2>
    <details class="panel">
      <summary>🧳 Packing list</summary>
      <div class="panel-body">
        <div class="pack-progress" id="packProgress"></div>
        <div id="packList"></div>
        <button class="pack-reset" id="packReset">Uncheck all</button>
      </div>
    </details>
  </main>

  <footer>
    <div>Made for David &amp; Paula · works offline once loaded</div>
    <div id="versionTag">App version: checking…</div>
  </footer>

  <div class="modal" id="ticketModal" role="dialog" aria-modal="true" aria-labelledby="ticketTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="ticketTitle">Ticket</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="ticketBody"></div>
    </div>
  </div>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

  <script>
    // ============================================================
    // TRIP CONSTANTS
    // ============================================================
    const TRIP_YEAR = 2026;
    const TRIP_MONTH = 9; // JS month index — October
    const TRIP_DAYS = [9, 10, 11, 12];
    const RACE_DAY = 11;
    const BIRTHDAY = 11;
    const APP_CACHE_PREFIX = 'victoria-2026-';

    // Victoria averages for early October — static fallback when offline
    const OCT_AVG = { hiC: 14, loC: 7, icon: '🌦️', desc: 'Early-October average', rain: '~45%', live: false };

    // ============================================================
    // BOARDING PASSES — FRS Clipper mobile passes (email "You Have Received A Boarding Pass
    // From FRS Clipper!", Oct 7, forwarded by Paula). QR PNGs inlined as data URIs so they work
    // offline with no extra files in ASSETS_TO_CACHE. Each QR is byte-identical to the email's
    // (PNG CRC verified) and decodes to "1,<token>#READY". Public site — David chose no lock (Oct 8).
    // ============================================================
    const BOARDING_PASSES = {
      out: {
        title: 'Boarding passes · Seattle → Victoria',

    const WMO_CODES = {
      0: ['☀️', 'Clear'], 1: ['🌤️', 'Mainly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
      45: ['🌫️', 'Fog'], 48: ['🌫️', 'Fog'],
      51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌧️', 'Heavy drizzle'],
      61: ['🌦️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'],
      80: ['🌦️', 'Showers'], 81: ['🌧️', 'Showers'], 82: ['⛈️', 'Heavy showers'],
      95: ['⛈️', 'Thunderstorm']
    };
    const cToF = c => Math.round(c * 9 / 5 + 32);

    function weatherBarInner(w) {
      return `
        <span class="weather-icon">${w.icon}</span>
        <span><span class="weather-temp">${w.hiC}° / ${w.loC}°C</span><span class="imperial-pill">${cToF(w.hiC)}° / ${cToF(w.loC)}°F</span></span>
        <span class="weather-rain">☔ ${w.rain}</span>
        <span class="weather-src">${w.live ? 'Live forecast' : 'Oct average'}</span>`;
    }

    function fetchWeather() {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=48.4284&longitude=-123.3656' +
        '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode' +
        '&timezone=America%2FVancouver&forecast_days=16';
      fetch(url)
        .then(r => r.json())
        .then(data => {
          if (!data.daily || !data.daily.time) return;
          const d = data.daily;
          dayData.forEach(day => {
            const key = `${TRIP_YEAR}-10-${String(day.number).padStart(2, '0')}`;
            const i = d.time.indexOf(key);
            if (i < 0 || d.temperature_2m_max[i] === null) return;
            const [icon, desc] = WMO_CODES[d.weathercode[i]] || ['⛅', 'Partly cloudy'];
            const rain = `${d.precipitation_probability_max[i] || 0}%`;
            day.weather = {
              hiC: Math.round(d.temperature_2m_max[i]),
              loC: Math.round(d.temperature_2m_min[i]),
              icon, desc,
              rain: day.isRace ? `${rain} · recheck at 6 am` : rain,
              live: true
            };
            const bar = document.querySelector(`[data-weather-day="${day.number}"]`);
            if (bar) { bar.innerHTML = weatherBarInner(day.weather); bar.title = desc; }
          });
        })
        .catch(err => console.log('[Weather] Offline, using October averages:', err.message));
    }

    // ============================================================
    // DATE HELPERS
    // ============================================================
    function tripDayForDate(d) {
      if (d.getFullYear() !== TRIP_YEAR || d.getMonth() !== TRIP_MONTH) return null;
      return TRIP_DAYS.includes(d.getDate()) ? d.getDate() : null;
    }

    function parseStopTime(timeStr, baseDate) {
      if (!timeStr || typeof timeStr !== 'string') return null;
      const m = timeStr.trim().toLowerCase().replace(/^~/, '').match(/^(\d{1,2}):(\d{2})\s*(am|pm)?/);
      if (!m) return null;
      let hr = parseInt(m[1], 10);
      const min = parseInt(m[2], 10);
      if (m[3] === 'pm' && hr < 12) hr += 12;
      if (m[3] === 'am' && hr === 12) hr = 0;
      const out = new Date(baseDate);
      out.setHours(hr, min, 0, 0);
      return out;
    }

    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

    const mapsSearch = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    const mapsWalk = q => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=walking`;

    function renderPills() {
      const todayDay = tripDayForDate(new Date());
      const pills = dayData.map(day => {
        const wk = day.date.split(',')[0].slice(0, 3);
        const cls = ['pill', day.isRace ? 'race' : '', day.number === todayDay ? 'today' : ''].filter(Boolean).join(' ');
        return `<a class="${cls}" href="#day-${day.number}" data-day="${day.number}">${wk} ${day.number}${day.isRace ? ' 🏅🎂' : ''}</a>`;
      }).join('');
      document.getElementById('dayPills').innerHTML = pills +
        `<a class="pill aux" href="#travel">⛴️ Travel</a>` +
        `<a class="pill aux" href="#resources">ℹ️ Resources</a>` +
        `<a class="pill aux" href="#packing">🧳 Packing</a>`;
    }

      return `
        <div class="racemode" id="raceModeBanner">
          <button class="race-close" id="raceModeClose" aria-label="Dismiss" hidden>×</button>
          <div class="race-k">🏅 Race Day</div>
          <div class="race-count" id="raceModeCountdown">8:15 AM start</div>
          <div class="race-sub" id="raceModeSubtitle">Outway Half · Legislative grounds · Bib 8697</div>
          <div class="race-grid">
            <div class="race-chip"><b>Wake</b>5:45 AM</div>
            <div class="race-chip"><b>Walk to start</b>7:30 AM · 300 m</div>
            <div class="race-chip"><b>Gun</b>8:15 AM · goal 2:00</div>
            <div class="race-chip"><b>Pace</b>5:41/km · 9:09/mi</div>
            <div class="race-chip"><b>Paula</b>Near the finish ~10:00</div>
            <div class="race-chip"><b>Finish</b>~10:15 AM</div>
            <div class="race-chip"><b>Birthday dinner</b>6:15 PM Il Terrazzo</div>
          </div>
        </div>`;
    }

    function renderDayCards() {
      const container = document.getElementById('dayCards');
      const todayDay = tripDayForDate(new Date());

      container.innerHTML = dayData.map((day, dayIdx) => {
        const expanded = day.number === todayDay ? 'expanded today-card' : (!todayDay && dayIdx === 0 ? 'expanded' : '');
        const cls = ['day-card', expanded, day.isRace ? 'race-day' : '', day.isBirthday ? 'bday-day' : ''].filter(Boolean).join(' ');
        const badges = [
          day.isRace ? '<span class="badge race">🏅 Half marathon</span>' : '',
          day.isBirthday ? '<span class="badge bday">🎂 Paula\'s birthday</span>' : '',
          day.isHoliday ? '<span class="badge holiday">🦃 Thanksgiving (Canada)</span>' : ''
        ].join('');

        return `
        <section class="${cls}" id="day-${day.number}" data-day="${day.number}">
          <div class="day-card-header" role="button" tabindex="0" aria-expanded="${expanded ? 'true' : 'false'}">
            <div>
              <div class="day-num-row">
                <span class="day-number">${day.number}</span>
                <span class="day-weekday">${day.date.split(',')[0]} · Day ${dayIdx + 1}</span>
              </div>
              <div class="day-theme">${day.theme}</div>
              ${badges.trim() ? `<div class="day-badges">${badges}</div>` : ''}
            </div>
            <div class="day-toggle">▾</div>
          </div>
          <div class="day-content">
            ${day.isRace ? raceBannerHtml() : ''}
            ${day.isBirthday ? `<div class="bday-note">🎂 <b>Happy birthday, Paula!</b> Race in the morning, then dinner at Il Terrazzo at 6:15.</div>` : ''}
            <div class="weather-bar" data-weather-day="${day.number}" title="${day.weather.desc}">${weatherBarInner(day.weather)}</div>
            <div class="stop-list">
              ${day.stops.map((stop, idx) => renderStop(day, stop, idx)).join('')}
            </div>
          </div>
        </section>`;
      }).join('');
    }

    function renderStop(day, stop, idx) {
      const stopCls = ['stop', stop.startLine ? 'start-line' : '', stop.bdayStop ? 'bday-stop' : ''].filter(Boolean).join(' ');
      const hasTransport = !!stop.transportDir;
      const actions = [
        stop.mapsQuery && !hasTransport ? `<a href="${mapsSearch(stop.mapsQuery)}" target="_blank" rel="noopener" class="maps-btn">📍 Open in Maps</a>` : '',
        stop.reservation ? `<span class="tag res">📋 Booked by ${stop.reservation.bookedBy} · ${stop.reservation.partySize} · <span class="conf">${stop.reservation.conf}</span></span>` : '',
        stop.suggested ? `<span class="tag sugg">💡 Suggested, not booked</span>` : '',
        stop.startLine ? `<span class="tag hl">Start line</span>` : ''
      ].join('');

      return `
        <div class="${stopCls}" data-stop-idx="${idx}">
          <div class="stop-time">${stop.time}</div>
          <div class="stop-header">
            <span class="stop-emoji">${stop.emoji}</span>
            <span class="stop-name">${stop.link ? `<a href="${stop.link}" target="_blank" rel="noopener">${stop.name}</a>` : stop.name}</span>
          </div>
          ${stop.details ? `<div class="stop-details">${stop.details}</div>` : ''}
          ${stop.checklist ? `
            <div class="stop-checklist">
              ${stop.checklist.map((item, i) => {
                const key = `d${day.number}-${slug(stop.name)}-${slug(item)}`;
                const id = `chk-${day.number}-${idx}-${i}`;
                return `<div class="stop-checklist-item"><input type="checkbox" id="${id}" data-key="${key}"><label for="${id}">${item}</label></div>`;
              }).join('')}
            </div>` : ''}
          ${stop.tbd ? `<div class="tbd-note">⚠️ TBD: ${stop.tbd}</div>` : ''}
          ${actions.trim() ? `<div class="stop-actions">${actions}</div>` : ''}
          ${stop.tickets ? ticketButton(stop.tickets) : ''}
          ${hasTransport ? `
            <div class="inline-transport">
              <div class="inline-transport-title">${stop.transportDir.name}</div>
              ${stop.transportDir.steps.map(s => `
                <div class="transport-step">
                  <div class="transport-step-icon step-${s.icon}">${getStepIcon(s.icon)}</div>
                  <span>${s.text}</span>
                </div>`).join('')}
              <div class="transport-time">${stop.transportDir.time}</div>
              ${stop.mapsQuery ? `<a href="${mapsSearch(stop.mapsQuery)}" target="_blank" rel="noopener" class="maps-btn" style="display:inline-block;margin-top:8px">📍 Open in Maps</a>` : ''}
            </div>` : ''}
        </div>
        ${stop.walkTo ? `
          <div class="walk-transition">
            <span>🚶 ${stop.walkTo}</span>
            ${stop.walkMapsQuery ? `<a href="${mapsWalk(stop.walkMapsQuery)}" target="_blank" rel="noopener" class="walk-maps">Walk →</a>` : ''}
          </div>` : ''}`;
    }

    function getStepIcon(type) {
      return { board: '▶', ride: '↓', transfer: '⇄', exit: '■', walk: '🚶' }[type] || '•';
    }

    // ============================================================
    // TRAVEL / RESOURCES / PACKING
    // ============================================================
    function renderTravelCard() {
      const grid = document.getElementById('travelGrid');
      // typeof, not window.travelData — top-level const doesn't attach to window (London KNOWN-ISSUES #5)
      if (!grid || typeof travelData === 'undefined') return;
      const { outbound, return: ret, hotel, race } = travelData;
      const leg = l => `
        <div class="row">
          <div class="row-title">${l.label} · ${l.carrier}</div>
          ${l.depart.place} · <strong>${l.depart.when}</strong><br>
          → ${l.arrive.place} · ${l.arrive.when}<br>
          <span class="muted">Booking</span> <span class="conf">${l.confirmation}</span>
          ${l.passes ? ticketButton({ name: 'Boarding passes', passes: l.passes }) : ''}
        </div>`;
      grid.innerHTML = `
        ${leg(outbound)}
        ${leg(ret)}
        <div class="row muted">${travelData.clipperNotes}</div>
        <div class="row">
          <div class="row-title">🏨 ${hotel.name}</div>
          <a href="${mapsSearch(hotel.mapsQuery)}" target="_blank" rel="noopener">${hotel.address}</a><br>
          <a href="tel:${hotel.phone.replace(/[\s-]/g, '')}">${hotel.phone}</a><br>
          Check-in: <strong>${hotel.checkIn}</strong><br>Check-out: <strong>${hotel.checkOut}</strong><br>
          <span class="muted">Conf</span> <span class="conf">${hotel.confirmation}</span>
          <div class="muted" style="margin-top:4px">${hotel.notes}</div>
        </div>
        <div class="row">
          <div class="row-title">🎽 <a href="${race.link}" target="_blank" rel="noopener">${race.name}</a></div>
          ${race.start}<br>
          Goal: <strong>${race.goal}</strong><br>
          Bib: <strong>${race.bib}</strong><br>
          <span class="muted">Race Roster conf</span> <span class="conf">${race.confirmation}</span>
        </div>`;
    }

    function renderResources() {
      document.getElementById('resourcesList').innerHTML = resources.map(g => `
        <details class="panel">
          <summary>${g.title}</summary>
          <div class="panel-body">
            ${g.rows.map(([k, v]) => `<div class="row"><div class="row-title">${k}</div>${v}</div>`).join('')}
          </div>
        </details>`).join('');
    }

    function renderPacking() {
      const el = document.getElementById('packList');
      el.innerHTML = Object.entries(packingList).map(([cat, items]) => `
        <div class="pack-cat">${cat}</div>
        ${items.map(([id, text]) => `
          <div class="pack-item">
            <input type="checkbox" id="pack-${id}" data-pack="${id}" ${lsGet(`pack-vic-${id}`) === '1' ? 'checked' : ''}>
            <label for="pack-${id}">${text}</label>
          </div>`).join('')}`).join('');
      updatePackProgress();
    }

    function updatePackProgress() {
      const all = document.querySelectorAll('[data-pack]');
      const done = [...all].filter(c => c.checked).length;
      document.getElementById('packProgress').textContent = `${done} of ${all.length} packed`;
    }

    // ============================================================
    // PERSISTENCE — namespaced keys: victoria2026-checked, pack-vic-*
    // ============================================================
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } }

    function getChecked() {
      try { return JSON.parse(lsGet('victoria2026-checked') || '{}'); } catch (e) { return {}; }
    }

    function setupChecklists() {
      const checked = getChecked();
      document.querySelectorAll('.stop-checklist input[data-key]').forEach(cb => {
        cb.checked = !!checked[cb.dataset.key];
        cb.addEventListener('change', () => {
          const c = getChecked();
          if (cb.checked) c[cb.dataset.key] = true; else delete c[cb.dataset.key];
          lsSet('victoria2026-checked', JSON.stringify(c));
        });
      });
    }

    // ============================================================
    // TODAY FOCUS + NOW BADGE
    // ============================================================
    function updateNowBadge() {
      try {
        document.querySelectorAll('.stop.now').forEach(el => el.classList.remove('now'));
        const now = new Date();
        const dayNum = tripDayForDate(now);
        if (!dayNum) return;
        const day = dayData.find(d => d.number === dayNum);
        const card = document.querySelector(`.day-card[data-day="${dayNum}"]`);
        if (!day || !card) return;
        let pastIdx = -1, upIdx = -1, pastDiff = Infinity, upDiff = Infinity;
        day.stops.forEach((s, i) => {
          const t = parseStopTime(s.time, now);
          if (!t) return;
          const diff = now - t;
          if (diff >= 0 && diff < pastDiff) { pastDiff = diff; pastIdx = i; }
          if (diff < 0 && -diff < upDiff) { upDiff = -diff; upIdx = i; }
        });
        const chosen = pastIdx >= 0 ? pastIdx : upIdx;
        const el = chosen >= 0 && card.querySelector(`.stop[data-stop-idx="${chosen}"]`);
        if (el) el.classList.add('now');
      } catch (e) { console.warn('[now-badge]', e); }
    }

    function initTodayFocus() {
      const dayNum = tripDayForDate(new Date());
      if (dayNum) {
        const card = document.querySelector(`.day-card[data-day="${dayNum}"]`);
        if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
      }
      updateNowBadge();
      setInterval(() => { if (document.visibilityState === 'visible') updateNowBadge(); }, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updateNowBadge(); });
    }

    function renderTripCountdown() {
      const el = document.getElementById('tripCountdown');
      const now = new Date();
      const start = new Date(TRIP_YEAR, TRIP_MONTH, 9);
      const end = new Date(TRIP_YEAR, TRIP_MONTH, 13);
      const days = Math.ceil((start - now) / 86400000);
      if (now < start) el.textContent = `⏳ ${days} day${days === 1 ? '' : 's'} to go`;
      else if (now < end) el.textContent = `📍 Day ${now.getDate() - 8} of 4`;
      else el.hidden = true;
    }

    // ============================================================
    // RACE MODE — live countdown on Oct 11 only
    // ============================================================
    function initRaceMode() {
      try {
        const banner = document.getElementById('raceModeBanner');
        if (!banner) return;
        const now = new Date();
        const isRaceDay = now.getFullYear() === TRIP_YEAR && now.getMonth() === TRIP_MONTH && now.getDate() === RACE_DAY;
        if (!isRaceDay) return;
        let dismissed = false;
        try { dismissed = sessionStorage.getItem('victoria2026-raceModeDismissed') === '1'; } catch (e) { /* ignore */ }
        if (dismissed) { banner.hidden = true; return; }
        document.getElementById('raceModeClose').hidden = false;

        const start = new Date(TRIP_YEAR, TRIP_MONTH, RACE_DAY, 8, 15, 0);
        const countEl = document.getElementById('raceModeCountdown');
        const subEl = document.getElementById('raceModeSubtitle');
        let timerId;
        const tick = () => {
          const diff = start - new Date();
          if (diff > 0) {
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            countEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')} to the start`;
          } else {
            const mins = Math.floor(-diff / 60000);
            if (mins < 210) {
              countEl.textContent = '🏃 Race in progress. Go David!';
              subEl.textContent = `Started ${mins} min ago · goal finish ~10:15 AM · RTRT.me`;
            } else {
              countEl.textContent = '🎂 Birthday mode';
              subEl.textContent = 'Il Terrazzo at 6:15 PM · 555 Johnson St';
              clearInterval(timerId);
            }
          }
        };
        tick();
        timerId = setInterval(tick, 1000);
        document.getElementById('raceModeClose').addEventListener('click', () => {
          banner.hidden = true;
          try { sessionStorage.setItem('victoria2026-raceModeDismissed', '1'); } catch (e) { /* ignore */ }
          clearInterval(timerId);
        });
      } catch (e) { console.warn('[race-mode]', e); }
    }

    // ============================================================
    // VERSION TAG — installed cache vs deployed sw.js (self-diagnose stale PWA)
    // ============================================================
    async function updateVersionTag() {
      const el = document.getElementById('versionTag');
      if (!el) return;
      const parseVer = s => { const m = s && s.match(/v(\d+)/); return m ? parseInt(m[1], 10) : null; };
      try {
        let installed = null;
        if ('caches' in window) {
          const keys = await caches.keys();
          const match = keys.filter(k => k.startsWith(APP_CACHE_PREFIX))
            .sort((a, b) => (parseVer(b) || 0) - (parseVer(a) || 0))[0];
          if (match) installed = match.replace(APP_CACHE_PREFIX, '');
        }
        let latest = null;
        try {
          const r = await fetch('./sw.js?nocache=' + Date.now(), { cache: 'no-store' });
          if (r.ok) {
            const m = (await r.text()).match(/CACHE_NAME\s*=\s*'victoria-2026-(v\d+)'/);
            if (m) latest = m[1];
          }
        } catch (e) { /* offline */ }

        el.classList.remove('stale');
        if (installed && latest && installed === latest) {
          el.textContent = `App version: ${installed} ✓`;
        } else if (installed && latest && parseVer(installed) < parseVer(latest)) {
          el.textContent = `Installed: ${installed} · Latest: ${latest}. Fully close and reopen the app to update`;
          el.classList.add('stale');
        } else if (installed) {
          el.textContent = `App version: ${installed}`;
        } else if (latest) {
          el.textContent = `App version: ${latest} (offline copy will be ready after the next reload)`;
        } else {
          el.textContent = 'App version: unknown';
        }
      } catch (e) {
        el.textContent = 'App version: unknown';
      }
    }

    // ============================================================
    // EVENTS
    // ============================================================
    // tickets: { name, pdf } opens a PDF; { name, passes: 'out'|'ret' } shows BOARDING_PASSES QRs
    function ticketButton(t) {
      const src = t.passes ? `data-ticket-passes="${t.passes}"` : `data-ticket-pdf="${t.pdf}"`;
      return `<button class="ticket-btn" data-ticket-name="${t.name}" ${src}>🎟 View ${t.name}</button>`;
    }

    function viewTicket(name, pdfPath) {
      document.getElementById('ticketTitle').textContent = name;
      const body = document.getElementById('ticketBody');
      body.innerHTML = '';
      const frame = document.createElement('iframe');
      frame.title = 'Ticket PDF';
      frame.src = pdfPath;
      body.appendChild(frame);
      document.getElementById('ticketModal').classList.add('open');
    }

    function viewPasses(key) {
      const set = BOARDING_PASSES[key];
      if (!set) return;
      document.getElementById('ticketTitle').textContent = set.title;
      const body = document.getElementById('ticketBody');
      body.innerHTML = `
        <div class="pass-tip">${set.when}<br>Turn screen brightness up · one QR per person</div>
        ${set.passes.map(p => `
          <div class="pass">
            <div class="pass-who">${p.who} · <span class="pass-seat">Seat ${p.seat}</span></div>
            <div class="pass-qr"><img src="${p.qr}" alt="Boarding pass QR code for ${p.who}, seat ${p.seat}"></div>
            <div class="pass-meta">Comfort · booking 1086760</div>
          </div>`).join('')}`;
      body.scrollTop = 0;
      document.getElementById('ticketModal').classList.add('open');
    }

    function openTicketButton(btn) {
      if (btn.dataset.ticketPasses) viewPasses(btn.dataset.ticketPasses);
      else viewTicket(btn.dataset.ticketName, btn.dataset.ticketPdf);
    }

    function closeTicket() {
      document.getElementById('ticketModal').classList.remove('open');
      document.getElementById('ticketBody').innerHTML = '';
    }

    function setupEventListeners() {
      document.getElementById('dayCards').addEventListener('click', e => {
        const header = e.target.closest('.day-card-header');
        if (header) {
          const card = header.parentElement;
          card.classList.toggle('expanded');
          header.setAttribute('aria-expanded', card.classList.contains('expanded'));
          return;
        }
        const tbtn = e.target.closest('.ticket-btn');
        if (tbtn) openTicketButton(tbtn);
      });
      document.getElementById('dayCards').addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('day-card-header')) {
          e.preventDefault();
          e.target.click();
        }
      });
      // Day pill → expand that day
      document.getElementById('dayPills').addEventListener('click', e => {
        const pill = e.target.closest('.pill[data-day]');
        if (!pill) return;
        const card = document.querySelector(`.day-card[data-day="${pill.dataset.day}"]`);
        if (card) card.classList.add('expanded');
      });
      document.getElementById('packList').addEventListener('change', e => {
        const cb = e.target.closest('[data-pack]');
        if (!cb) return;
        if (cb.checked) lsSet(`pack-vic-${cb.dataset.pack}`, '1'); else lsDel(`pack-vic-${cb.dataset.pack}`);
        updatePackProgress();
      });
      document.getElementById('packReset').addEventListener('click', () => {
        if (!confirm('Uncheck every packing item?')) return;
        document.querySelectorAll('[data-pack]').forEach(cb => { cb.checked = false; lsDel(`pack-vic-${cb.dataset.pack}`); });
        updatePackProgress();
      });
      document.getElementById('travelGrid').addEventListener('click', e => {
        const tbtn = e.target.closest('.ticket-btn');
        if (tbtn) openTicketButton(tbtn);
      });
      document.getElementById('modalClose').addEventListener('click', closeTicket);
      document.getElementById('ticketModal').addEventListener('click', e => { if (e.target.id === 'ticketModal') closeTicket(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('ticketModal').classList.contains('open')) closeTicket();
      });
      const btt = document.getElementById('backToTop');
      window.addEventListener('scroll', () => btt.classList.toggle('show', window.scrollY > 600), { passive: true });
      btt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      }
    }

    function init() {
      renderPills();
      renderDayCards();
      setupChecklists();
      renderTravelCard();
      renderResources();
      renderPacking();
      renderTripCountdown();
      setupEventListeners();
      registerServiceWorker();
      fetchWeather();      // non-blocking; offline → October averages stay
      initTodayFocus();
      initRaceMode();
      updateVersionTag();
    }

    init();
  </script>
</body>
